name: Dashboard Kindle

# Mises à jour pour le matin (7h), le midi (12h) et le soir (18h), heure de Paris.
# Génération une demi-heure avant l'affichage, avec changement d'heure automatique.
on:
  schedule:
    - cron: "30 6,11,17 * * *"
      timezone: Europe/Paris
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install Pillow

      - name: Vérifier le calendrier et le téléchargement
        run: python -m unittest discover -s tests -v

      - name: Générer l'image
        run: python generator/generate.py --out site

      # Publie site/ sur la branche gh-pages (servie par GitHub Pages).
      # Chaque publication est un commit : le dépôt reste « actif » et GitHub
      # ne désactive pas le cron au bout de 60 jours.
      - name: Publier
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true
          commit_message: "Dashboard ${{ github.run_number }}"
