name: Atelier Kindle
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      authorization_probe:
        description: Vérifier l’autorisation du Kindle sans publier
        type: boolean
        default: false
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: atelier-kindle-pages-${{ github.event_name == 'workflow_dispatch' && inputs.authorization_probe && 'authorization' || 'edition' }}
  cancel-in-progress: false
jobs:
  authorization:
    if: github.event_name == 'workflow_dispatch' && inputs.authorization_probe
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Autorisation de déclenchement vérifiée'
  render:
    if: github.event_name != 'workflow_dispatch' || !inputs.authorization_probe
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Identifier le compilateur
        id: compiler
        run: |
          { swift --version; xcodebuild -version; xcrun --show-sdk-version; } | shasum -a 256 | awk '{print "key=" $1}' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: atelier/renderer/.build
          key: kindle-renderer-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.key }}-${{ hashFiles('atelier/renderer/**') }}
      - name: Compiler le moteur natif
        run: swift build -c release --package-path atelier/renderer
      - uses: actions/configure-pages@v5
        id: pages
      - name: Produire l’édition
        run: |
          atelier/renderer/.build/release/RenderKindle atelier/composition.kindlepage site --previous "${{ steps.pages.outputs.base_url }}/sources.json"
          cp atelier/deployment.txt site/deployment.txt
          date -u +%s > site/generated-at.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy